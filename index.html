<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>百年AI · 智慧康复知识库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7fa;color:#333}
.header{background:linear-gradient(135deg,#4a6cf7,#6b8cff);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px}
.header small{opacity:.8;font-size:13px;margin-left:8px}
.container{max-width:960px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:20px;margin-bottom:20px}
.card h2{font-size:17px;margin-bottom:14px;color:#333;display:flex;align-items:center;gap:6px}
input[type=text],select,textarea{width:100%;padding:10px 12px;border:1px solid #d9dce1;border-radius:8px;font-size:14px;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:#4a6cf7}
button{padding:10px 20px;border:none;border-radius:8px;background:#4a6cf7;color:#fff;font-size:14px;cursor:pointer;transition:background .2s}
button:hover{background:#3b5de7}
button:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;margin-right:6px}
.tag-clinical{background:#e3f2fd;color:#1976d2}
.tag-sop{background:#fff3e0;color:#e65100}
.tag-research{background:#f3e5f5;color:#7b1fa2}
.doc-list{list-style:none}
.doc-list li{padding:10px 12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.chat-box{max-height:350px;overflow-y:auto;padding:12px;background:#fafbfc;border-radius:8px;margin-bottom:12px}
.msg{margin-bottom:10px;padding:10px 14px;border-radius:10px;max-width:85%;font-size:14px;line-height:1.6;white-space:pre-wrap}
.msg-user{background:#e3f2fd;margin-left:auto;color:#1565c0}
.msg-ai{background:#fff;border:1px solid #e0e0e0}
.chat-row{display:flex;gap:8px}
#chatInput{flex:1}
</style>
</head>
<body>

<div class="header">
  <h1>🏛️ 智慧康复知识库<small>百年AI v2.0 — 本地版</small></h1>
  <div id="status" style="font-size:13px;opacity:.9">连接中...</div>
</div>

<div class="container">

  <!-- 快速填充 -->
  <div class="card">
    <h2>⚡ 一键填充示例数据（4条）</h2>
    <button onclick="seedData()" id="btnSeed">📥 填充示例数据</button>
  </div>

  <!-- 上传 -->
  <div class="card">
    <h2>📤 上传康复文档到知识库</h2>
    <select id="category"><option value="general">通用知识</option><option value="clinical">临床路径</option><option value="sop">SOP流程</option><option value="research">科研教学</option></select>
    <br><br>
    <label style="display:block;margin-bottom:8px;font-size:13px">粘贴文本：</label>
    <textarea id="textContent" rows="4" placeholder="粘贴康复医学相关文本内容..."></textarea>
    <br><br>
    <input type="text" id="docTitle" placeholder="文档标题（可选）" style="margin-bottom:10px"/>
    <button onclick="uploadText()" id="btnUpload">📎 上传到知识库</button>
  </div>

  <!-- 搜索 -->
  <div class="card">
    <h2>🔍 知识库智能搜索</h2>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input type="text" id="searchQuery" placeholder="输入关键词..." onkeydown="if(event.key==='Enter')doSearch()"/>
      <button onclick="doSearch()">🔍</button>
    </div>
    <ul class="doc-list" id="searchResults"></ul>
  </div>

  <!-- AI对话 -->
  <div class="card">
    <h2>🤖 知识库智能问答（大耳兔后台版）</h2>
    <div class="chat-box" id="chatBox">
      <div class="msg msg-ai">你好！我是康复医学AI助手。请输入专业问题，我将基于知识库回答。</div>
    </div>
    <div class="chat-row">
      <input type="text" id="chatInput" placeholder="输入康复医学相关问题..." onkeydown="if(event.key==='Enter')doChat()"/>
      <button onclick="doChat()" id="btnChat">💬 提问</button>
    </div>
  </div>

  <!-- 文档列表 -->
  <div class="card">
    <h2>📋 知识库文档清单</h2>
    <ul class="doc-list" id="docList"></ul>
  </div>

</div>

<script>
const API='http://127.0.0.1:8000';

async function api(url,opts={}){
  const r=await fetch(API+url,opts);
  return r.json();
}

// 状态
api('/health').then(()=>{document.getElementById('status').textContent='✅ 知识库服务已连接'}).catch(()=>{document.getElementById('status').textContent='❌ API未响应'});

// 填充示例
async function seedData(){
  const b=document.getElementById('btnSeed');b.disabled=true;b.textContent='⏳ 填充中...';
  await api('/seed',{method:'POST',headers:{'Content-Type':'application/json'}});
  loadDocs();b.disabled=false;b.textContent='📥 已填充，可再次填充';
}

// 上传文本
async function uploadText(){
  const text=document.getElementById('textContent').value.trim();
  if(!text){alert('请输入内容');return}
  const b=document.getElementById('btnUpload');b.disabled=true;b.textContent='⏳ 上传中...';
  const title=document.getElementById('docTitle').value.trim()||'新文档';
  const cat=document.getElementById('category').value;
  const fd=new FormData();fd.append('text',text);fd.append('title',title);fd.append('category',cat);
  await api('/upload-text',{method:'POST',body:fd});
  document.getElementById('textContent').value='';document.getElementById('docTitle').value='';
  loadDocs();b.disabled=false;b.textContent='📎 上传到知识库';alert('✅ 上传成功');
}

// 搜索
async function doSearch(){
  const q=document.getElementById('searchQuery').value.trim();if(!q)return;
  const fd=new FormData();fd.append('q',q);
  const r=await api('/api-search',{method:'POST',body:fd});
  const ul=document.getElementById('searchResults');ul.innerHTML='';
  (r.results||[]).forEach(d=>{
    const li=document.createElement('li');
    li.innerHTML=`<div><strong>${d.payload?.title||''}</strong><br><span class="tag tag-${d.payload?.category||'general'}">${d.payload?.category||'general'}</span> <small>相关度: ${d.score}</small></div>`;
    ul.appendChild(li);
  });
}

// 对话
async function doChat(){
  const q=document.getElementById('chatInput').value.trim();if(!q)return;
  const box=document.getElementById('chatBox');
  const b=document.getElementById('btnChat');b.disabled=true;b.textContent='⏳';
  box.innerHTML+=`<div class="msg msg-user">${q}</div>`;
  try{
    const r=await api('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
    box.innerHTML+=`<div class="msg msg-ai">🤖 ${r.answer}</div>`;
  }catch(e){box.innerHTML+=`<div class="msg msg-ai">⚠️ 请求失败: ${e.message}</div>`}
  b.disabled=false;b.textContent='💬 提问';document.getElementById('chatInput').value='';box.scrollTop=box.scrollHeight;
}

// 加载文档列表
async function loadDocs(){
  const r=await api('/api-docs');
  const ul=document.getElementById('docList');ul.innerHTML='';
  (r.docs||[]).forEach(d=>{
    const li=document.createElement('li');
    li.innerHTML=`<div><strong>${d.title}</strong> <span class="tag tag-${d.category}">${d.category}</span></div>
      <button onclick="delDoc('${d.id}')" style="background:#ef5350;padding:4px 10px;font-size:12px">删除</button>`;
    ul.appendChild(li);
  });
}

async function delDoc(id){if(!confirm('确认删除？'))return;await api('/doc/'+id,{method:'DELETE'});loadDocs();}

// 初始加载
loadDocs();
</script>

</body>
</html>
